# En k3s : le routage /api → backend est fait par l'Ingress Traefik,
# pas par ce nginx. On se contente de servir la SPA.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback : toute URL inconnue renvoie index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
